<!doctype html>
<!--
  index.html är appens SKELETT.
  Här står vilka delar sidan består av, men inte hur de ser ut (det gör style.css)
  och inte hur de fungerar (det gör app.js).
-->
<html lang="sv">
<head>
  <meta charset="utf-8">

  <!-- Säger åt telefonen att visa sidan i telefonens bredd, i stället för som en förminskad datorsida. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Hindrar iPhone från att göra om långa tal till telefonnummer-länkar. -->
  <meta name="format-detection" content="telephone=no">

  <title>Ekonomi</title>

  <!-- De här raderna gör att sidan beter sig som en app när den läggs på hemskärmen:
       eget namn, egen ikon och ingen adressrad. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="ikoner/ikon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ekonomi">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F2F3F5">

  <!-- Kopplar in utseendet. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Här inne ritar app.js upp den skärm som visas just nu. -->
  <main id="app"></main>

  <!-- Flikraden längst ner. data-vy talar om för app.js vilken skärm knappen ska öppna. -->
  <nav class="flikar" aria-label="Flikar">
    <button type="button" class="flik" data-vy="pengar">
      <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18"></path><path d="M15 15h3"></path></svg>
      <span>Pengar</span>
    </button>
    <button type="button" class="flik" data-vy="bilar">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 11l1.6-4.2A2 2 0 0 1 8.5 5.5h7a2 2 0 0 1 1.9 1.3L19 11"></path><rect x="3" y="11" width="18" height="6" rx="2"></rect><path d="M6.5 17v2"></path><path d="M17.5 17v2"></path></svg>
      <span>Bilar</span>
    </button>
    <button type="button" class="flik" data-vy="installningar">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h2"></path><path d="M10 17h10"></path><circle cx="8" cy="17" r="2"></circle></svg>
      <span>Inställningar</span>
    </button>
  </nav>

  <!-- Kopplar in funktionen. Ligger sist så att allt ovanför redan finns när koden startar. -->
  <script src="app.js"></script>
</body>
</html>
